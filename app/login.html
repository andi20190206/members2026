<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 · 唯车转</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f0f0; }
  .phone-shell { max-width: 420px; margin: 0 auto; min-height: 100vh; background: #fff; position: relative; overflow: hidden; }
  @media (min-width: 768px) { body { background: #f5f5f7; padding: 24px 0; } .phone-shell { border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,.2); } }
  /* 装饰圆圈 */
  .deco-bg::before { content: ''; position: absolute; top: -80px; right: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, #fed7aa 0%, #fde68a 40%, transparent 70%); opacity: .6; z-index: 0; }
  .deco-bg::after { content: ''; position: absolute; top: 100px; right: -30px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #fecaca 0%, transparent 70%); opacity: .5; z-index: 0; }
  .deco-dots { position: absolute; top: 190px; right: 30px; width: 80px; height: 80px; z-index: 0; opacity: .4;
    background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
    background-size: 10px 10px; }
  .deco-dot-circle { position: absolute; top: 230px; left: 40px; width: 10px; height: 10px; border-radius: 50%; background: #fbbf24; z-index: 0; opacity: .5; }
  .brand-logo { width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, #f97316 0%, #dc2626 100%); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 8px 24px rgba(249, 115, 22, .35); }
</style>
</head>
<body>

<div class="phone-shell deco-bg">
  <div class="deco-dots"></div>
  <div class="deco-dot-circle"></div>

  <!-- Status -->
  <div class="relative z-10 flex items-center justify-between px-5 py-2 text-slate-800 text-sm">
    <span>13:31</span>
    <span class="flex items-center gap-1"><i data-lucide="signal" class="w-3.5 h-3.5"></i><i data-lucide="wifi" class="w-3.5 h-3.5"></i><i data-lucide="battery-full" class="w-3.5 h-3.5"></i></span>
  </div>

  <!-- 返回 -->
  <div class="relative z-10 px-5 py-4">
    <a href="profile.html" class="text-slate-800"><i data-lucide="chevron-left" class="w-6 h-6" style="stroke-width:2.5"></i></a>
  </div>

  <!-- 品牌 + 欢迎语 -->
  <div class="relative z-10 px-8 pt-6">
    <div class="brand-logo mb-8">
      <span class="text-3xl font-black tracking-tight">唯</span>
    </div>
    <h1 class="text-4xl font-black text-slate-900 mb-3">嗨,欢迎回来</h1>
    <p class="text-sm text-slate-500">登录后更精彩,车源好货即将开启</p>
  </div>

  <!-- 手机号输入 -->
  <div class="relative z-10 px-8 mt-14">
    <div class="bg-slate-50 rounded-2xl px-5 py-4 flex items-center gap-4">
      <button class="flex items-center gap-1 text-slate-800 font-semibold text-lg">
        +86
        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
      </button>
      <span class="w-px h-6 bg-slate-300"></span>
      <input id="phoneInput" class="flex-1 bg-transparent outline-none text-xl font-semibold text-slate-900 placeholder-slate-300" placeholder="请输入手机号" type="tel" maxlength="13">
    </div>
  </div>

  <!-- Mock 填充 -->
  <div class="relative z-10 px-8 mt-3">
    <button onclick="document.getElementById('phoneInput').value='130 1604 4608'" class="w-full py-2 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-700 font-medium flex items-center justify-center gap-1.5">
      <i data-lucide="wrench" class="w-3.5 h-3.5"></i>一键填充测试手机号(Demo 用)
    </button>
  </div>

  <!-- 协议 -->
  <div class="relative z-10 px-8 mt-8 flex items-start gap-2">
    <input type="checkbox" checked class="mt-0.5 accent-red-500">
    <span class="text-xs text-slate-600 leading-relaxed">阅读并同意 <a class="text-orange-500">服务协议及唯车转基本功能个人信息处理规则</a></span>
  </div>

  <!-- 下一步 -->
  <div class="relative z-10 px-8 mt-6">
    <a href="profile-loggedin.html" class="block w-full py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-full text-center text-base font-semibold shadow-xl">
      下一步
    </a>
    <div class="text-right mt-4">
      <a class="text-sm text-slate-500">登录遇到问题</a>
    </div>
  </div>

  <!-- 其他登录方式 -->
  <div class="absolute bottom-16 left-0 right-0 z-10 px-8">
    <div class="flex items-center justify-center gap-6">
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-white shadow-lg">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </div>
        <span class="text-[10px] text-slate-500">支付宝</span>
      </button>
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center text-white shadow-lg">
          <i data-lucide="message-circle" class="w-7 h-7"></i>
        </div>
        <span class="text-[10px] text-slate-500">微信</span>
      </button>
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-red-500 to-rose-700 flex items-center justify-center text-white shadow-lg">
          <i data-lucide="badge-check" class="w-7 h-7"></i>
        </div>
        <span class="text-[10px] text-slate-500">身份认证</span>
      </button>
      <button class="flex flex-col items-center gap-1.5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white shadow-lg">
          <i data-lucide="smartphone" class="w-7 h-7"></i>
        </div>
        <span class="text-[10px] text-slate-500">手机号</span>
      </button>
    </div>
  </div>

</div>

<div class="hidden md:block fixed top-4 left-4 z-50">
  <a href="../index.html" class="px-4 py-2 bg-white rounded-full shadow-lg text-sm text-slate-700 hover:bg-slate-50">← 返回 Demo 导航</a>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
